    /* ---------- Math helpers ---------- */
    function norm(s) {
      return String(s).trim()
        .replace(/π/g, "pi")
        .replace(/×/g, "*")
        .replace(/÷/g, "/")
        .replace(/−/g, "-")
        .replace(/\s+/g, "")
        .replace(/degrees?|deg|rads?|rpm/gi, "")
        .replace(/\^/g, "**")
        .toLowerCase();
    }
    function evalExpr(s) {
      const t = norm(s);
      if (!t) return NaN;
      if (!/^[0-9.+*/()pi-]+$/.test(t.replace(/\*\*/g, ""))) return NaN;
      try {
        const fn = new Function("pi", "return (" + t + ");");
        const v = fn(Math.PI);
        return typeof v === "number" && isFinite(v) ? v : NaN;
      } catch (e) { return NaN; }
    }
    function close(a, b, rel) {
      if (!isFinite(a) || !isFinite(b)) return false;
      const tol = Math.max(Math.abs(b) * (rel || 0.02), 0.015);
      return Math.abs(a - b) <= tol;
    }
    function mark(input, fb, ok, msg) {
      input.style.borderColor = ok ? "#1b7a46" : "#b42318";
      fb.className = "feedback " + (ok ? "ok" : "bad");
      fb.textContent = msg;
    }
    function checkOne(id, expected, exactText) {
      const input = document.getElementById(id);
      const fb = document.getElementById("fb_" + id);
      const v = evalExpr(input.value);
      const ok = expected.some(e => close(v, e));
      if (ok) mark(input, fb, true, t("correct") + (exactText ? "  " + exactText : ""));
      else if (!input.value.trim()) mark(input, fb, false, t("enterAns"));
      else mark(input, fb, false, t("notQuite"));
      return ok;
    }

    /* ---------- Radian explorer ---------- */
    function polar(cx, cy, r, ang) {
      return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
    }
    function arcPath(cx, cy, r, a0, a1, swap) {
      const [x0, y0] = polar(cx, cy, r, a0);
      const [x1, y1] = polar(cx, cy, r, a1);
      const large = (a1 - a0) > Math.PI ? 1 : 0;
      return `M ${cx} ${cy} L ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} Z`;
    }
    function arcOnly(cx, cy, r, a0, a1) {
      const [x0, y0] = polar(cx, cy, r, a0);
      const [x1, y1] = polar(cx, cy, r, a1);
      const large = (a1 - a0) > Math.PI ? 1 : 0;
      return `M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1}`;
    }
    function fmt(th) {
      const keys = [
        [1, "1"], [Math.PI/6, "π/6"], [Math.PI/4, "π/4"], [Math.PI/3, "π/3"],
        [Math.PI/2, "π/2"], [2*Math.PI/3, "2π/3"], [3*Math.PI/4, "3π/4"],
        [Math.PI, "π"], [5*Math.PI/4, "5π/4"], [3*Math.PI/2, "3π/2"],
        [7*Math.PI/4, "7π/4"], [2*Math.PI, "2π"]
      ];
      for (const [v, s] of keys) if (Math.abs(th - v) < 0.02) return s + " rad";
      return th.toFixed(2) + " rad";
    }

    function updateRad() {
      const th = +document.getElementById("radSlider").value;
      const cx = 160, cy = 115, R = 90;
      const a0 = 0, a1 = th;

    function drawDisp(th) {

    function playDisp() {

        drawDisp(v);

    }

    /* ---------- omega animation ---------- */
    let wAngle = 0, wLast = 0, wRaf = 0;
    function tickW(ts) {
      const sl = document.getElementById("wSlider");
      if (!sl) { wRaf = 0; return; }
      if (!wLast) wLast = ts;
      const dt = Math.min(0.05, (ts - wLast) / 1000);
      wLast = ts;
      const w = +sl.value;
      wAngle += w * dt;
      const cx = 160, cy = 88, R = 60;
      const a = -Math.PI/2 + wAngle;
      const [x, y] = polar(cx, cy, R, a);
      document.getElementById("wRay").setAttribute("x2", x);
      document.getElementById("wRay").setAttribute("y2", y);
      document.getElementById("wObj").setAttribute("cx", x);
      document.getElementById("wObj").setAttribute("cy", y);
      document.getElementById("wLbl").textContent = w.toFixed(2) + " rad s⁻¹";
      wRaf = requestAnimationFrame(tickW);
    }

    function initStep(n) {
      if (dispTimer) { clearInterval(dispTimer); dispTimer = null; }
      if (wRaf) { cancelAnimationFrame(wRaf); wRaf = 0; wLast = 0; }

      const radSl = document.getElementById("radSlider");
      if (radSl && steps[n].contains(radSl) && !radSl.dataset.ready) {
        radSl.addEventListener("input", updateRad);
        radSl.dataset.ready = "1";
      }
      if (radSl && steps[n].contains(radSl)) updateRad();

      const ct = document.getElementById("checkTable");
      if (ct && !ct.dataset.ready) {
        ct.addEventListener("click", () => checkTable(false));
        document.getElementById("revealTable").addEventListener("click", () => checkTable(true));
        ct.dataset.ready = "1";
      }

      const c1 = document.getElementById("checkP1");
      if (c1 && !c1.dataset.ready) {
        c1.addEventListener("click", () => {
          checkOne("p1", [Math.PI/4], t("exactPrefix") + "π/4 rad.");
          checkOne("p2", [5*Math.PI/6], t("exactPrefix") + "5π/6 rad.");
          checkOne("p3", [75*180/Math.PI], "75 × 180/π ≈ 4297°.");
          checkOne("p4", [20*Math.PI], t("exactPrefix") + "20π rad.");
        });
        c1.dataset.ready = "1";
      }
      const c2 = document.getElementById("checkP2");
      if (c2 && !c2.dataset.ready) {
        c2.addEventListener("click", () => {
          checkOne("p5", [Math.PI/216], "50° × (π/180) ÷ 60 = π/216 ≈ 0.0145 rad s⁻¹.");
          checkOne("p6", [2000/3600, 5/9], "2000 / 3600 = 5/9 ≈ 0.556 rad s⁻¹.");
          checkOne("p7", [20*2*Math.PI/60, 2*Math.PI/3], "20 × 2π / 60 = 2π/3 ≈ 2.09 rad s⁻¹.");
          checkOne("p8", [6*60/(2*Math.PI), 180/Math.PI], "6 × 60 / 2π = 180/π ≈ 57.3 rpm.");
        });
        c2.dataset.ready = "1";
      }

      const ds = document.getElementById("dispSlider");
      if (ds && steps[n].contains(ds)) {
        if (!ds.dataset.ready) {
          ds.addEventListener("input", () => drawDisp(+ds.value));
          document.getElementById("dispPlay").addEventListener("click", playDisp);
          ds.dataset.ready = "1";
        }
        drawDisp(+ds.value);
      }

      const ts = document.getElementById("twoSlider");
      if (ts && steps[n].contains(ts)) {
        if (!ts.dataset.ready) {
          ts.addEventListener("input", () => drawTwo(+ts.value));
          ts.dataset.ready = "1";
        }
        drawTwo(+ts.value);
      }

      const ws = document.getElementById("wSlider");
      if (ws && steps[n].contains(ws)) {
        wRaf = requestAnimationFrame(tickW);
      }

      const link = document.getElementById("formLink");
      if (link) {
        const url = (window.GOOGLE_FORM_URL || "").trim();
        if (url) {
          link.href = url;
          link.classList.remove("hidden");
          document.getElementById("formMsg").textContent = t("formMsgReady");
        }
      }
    }


    document.getElementById("langEn").addEventListener("click", () => setLang("en"));
    document.getElementById("langZh").addEventListener("click", () => setLang("zh-HK"));

    const params = new URLSearchParams(location.search);
    const ql = params.get("lang");
    if (ql === "zh-HK" || ql === "en") {
      lang = ql;
      try { localStorage.setItem("cm11.lang", lang); } catch (e) {}
    }
    const q = params.get("step");
    const start = q !== null && !isNaN(+q) ? Math.max(0, Math.min(steps.length - 1, +q)) : 0;
    go(start);
  })();
  </script>
</body>
</html>
