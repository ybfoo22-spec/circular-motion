      const Lv = 46;
      setLine("c5v", x, y, x + Lv * tx, y + Lv * ty);
      labelBeside("c5labV", x + Lv * tx, y + Lv * ty, tx, ty, 1);
      setVis("c5v", c5ShowV);
      setVis("c5labV", c5ShowV);
      const trail = document.getElementById("c5trail");
      if (trail) {
        const pts = c5Trail.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
        trail.setAttribute("points", pts);
      }
      const tan = document.getElementById("c5tan");
      if (tan) {
        if (c5Broken) {
          const s = 220;
          tan.setAttribute("opacity", "0.85");
          setLine("c5tan", x - s * tx, y - s * ty, x + s * tx, y + s * ty);
        } else {
          tan.setAttribute("opacity", "0");
        }
      }
    }
    function tickC5(ts) {
      if (!c5Play) { c5Raf = 0; c5Last = 0; return; }
      if (!c5Last) c5Last = ts;
      const dt = Math.min(0.05, (ts - c5Last) / 1000);
      c5Last = ts;
      if (!c5Broken) {
        c5Ang += C5_W * dt;
        const [x, y] = polar(C5_CX, C5_CY, C5_R, c5Ang);
        c5Trail.push([x, y]);
        if (c5Trail.length > 180) c5Trail.shift();
      } else {
        c5X += c5Vx * dt;
        c5Y += c5Vy * dt;
        c5Trail.push([c5X, c5Y]);
        if (c5Trail.length > 240) c5Trail.shift();
      }
      drawC5();
      c5Raf = requestAnimationFrame(tickC5);
    }
    function toggleC5() {
      c5Play = !c5Play;
      const btn = document.getElementById("c5play");
      if (btn) {
        btn.setAttribute("data-playing", c5Play ? "1" : "0");
        btn.textContent = c5Play ? t("stop") : t("play");
      }
      if (c5Play) { c5Last = 0; c5Raf = requestAnimationFrame(tickC5); }
    }
    function breakC5() {
      if (c5Broken) return;
      const [x, y] = polar(C5_CX, C5_CY, C5_R, c5Ang);
      // velocity in px/s: ω R in the tangent direction
      const tx = -Math.sin(c5Ang), ty = -Math.cos(c5Ang);
      c5X = x; c5Y = y;
      c5Vx = C5_W * C5_R * tx;
      c5Vy = C5_W * C5_R * ty;
      c5Broken = true;
      if (!c5Play) { c5Play = true; c5Last = 0; c5Raf = requestAnimationFrame(tickC5); }
      const btn = document.getElementById("c5play");
      if (btn) {
        btn.setAttribute("data-playing", "1");
        btn.textContent = t("stop");
      }
      drawC5();
    }
    function resetC5() {
      c5Play = false;
      c5Broken = false;
      c5Ang = 0.35;
      c5Trail.length = 0;
      if (c5Raf) { cancelAnimationFrame(c5Raf); c5Raf = 0; }
      c5Last = 0;
      const btn = document.getElementById("c5play");
      if (btn) { btn.setAttribute("data-playing", "0"); btn.textContent = t("play"); }
      drawC5();
    }

    function stopAnims() {
      bPlay = false; c4Play = false; c5Play = false;
      if (bRaf) { cancelAnimationFrame(bRaf); bRaf = 0; }
      if (c4Raf) { cancelAnimationFrame(c4Raf); c4Raf = 0; }
      if (c5Raf) { cancelAnimationFrame(c5Raf); c5Raf = 0; }
      bLast = c4Last = c5Last = 0;
      ["bPlay", "c4play", "c5play"].forEach((id) => {
        const b = document.getElementById(id);
        if (b) { b.setAttribute("data-playing", "0"); b.textContent = t("play"); }
      });
    }

    function initStep(n) {
      stopAnims();
      const step = steps[n];

      const bPlayBtn = document.getElementById("bPlay");
      if (bPlayBtn && step.contains(bPlayBtn)) {
        if (!bPlayBtn.dataset.ready) {
          bPlayBtn.addEventListener("click", toggleB);
          document.getElementById("bShowV").addEventListener("click", () => {
            bShowV = !bShowV;
            document.getElementById("bShowV").setAttribute("aria-pressed", bShowV ? "true" : "false");
            drawB();
          });
          document.getElementById("bShowA").addEventListener("click", () => {
            bShowA = !bShowA;
            document.getElementById("bShowA").setAttribute("aria-pressed", bShowA ? "true" : "false");
            drawB();
          });
          bPlayBtn.dataset.ready = "1";
        }
        drawB();
        if (!bPlay) toggleB();
      }

      const c4btn = document.getElementById("c4play");
      if (c4btn && step.contains(c4btn)) {
        if (!c4btn.dataset.ready) {
          c4btn.addEventListener("click", toggleC4);
          c4btn.dataset.ready = "1";
        }
        drawC4();
        if (!c4Play) toggleC4();
      }

      const c5btn = document.getElementById("c5play");
      if (c5btn && step.contains(c5btn)) {
        if (!c5btn.dataset.ready) {
          c5btn.addEventListener("click", toggleC5);
          document.getElementById("c5break").addEventListener("click", breakC5);
          document.getElementById("c5reset").addEventListener("click", resetC5);
          document.getElementById("c5showV").addEventListener("click", () => {
            c5ShowV = !c5ShowV;
            document.getElementById("c5showV").setAttribute("aria-pressed", c5ShowV ? "true" : "false");
            drawC5();
          });
          c5btn.dataset.ready = "1";
        }
        // keep broken state if the student already used it in this session,
        // but redraw; reset only when they press Reset.
        drawC5();
      }

      const c2 = document.getElementById("checkQC2");
      if (c2 && !c2.dataset.ready) {
        c2.addEventListener("click", () => checkQC2(false));
        document.getElementById("revealQC2").addEventListener("click", () => checkQC2(true));
        c2.dataset.ready = "1";
      }
      const c3 = document.getElementById("checkQC3");
      if (c3 && !c3.dataset.ready) {
        c3.addEventListener("click", () => checkQC3(false));
        document.getElementById("revealQC3").addEventListener("click", () => checkQC3(true));
        const group = document.getElementById("qc3chg");
        group.querySelectorAll("button.choice").forEach((btn) => {
          btn.addEventListener("click", () => {
            group.querySelectorAll("button.choice").forEach((b) => {
              b.setAttribute("aria-pressed", b === btn ? "true" : "false");
              b.classList.remove("is-ok", "is-bad");
            });
          });
        });
        c3.dataset.ready = "1";
      }
    }

    document.getElementById("langEn").addEventListener("click", () => setLang("en"));
    document.getElementById("langZh").addEventListener("click", () => setLang("zh-HK"));

    const params = new URLSearchParams(location.search);
    const ql = params.get("lang");
    if (ql === "zh-HK" || ql === "en") {
      lang = ql;
      try { localStorage.setItem("cm11.lang", lang); } catch (e) {}
    }
    const q = params.get("step");
    const start = q !== null && !isNaN(+q) ? Math.max(0, Math.min(steps.length - 1, +q)) : 0;
    go(start);
  })();
  </script>
</body>
