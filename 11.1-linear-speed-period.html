        .replace(/\^2/g, "²")
        .replace(/v\s*\*\s*v/gi, "v²")
        .replace(/\(v\)²/gi, "v²")
        .toLowerCase();
    }
    function checkSym(id, accepted, exactText, reveal, fillText) {
      const input = document.getElementById(id);
      const fb = document.getElementById("fb_" + id);
      if (reveal) {
        input.value = fillText;
        mark(input, fb, true, exactText || fillText);
        return true;
      }
      const n = normSym(input.value);
      const ok = !!n && accepted.some(a => n === normSym(a));
      if (ok) mark(input, fb, true, t("correct") + (exactText ? "  " + exactText : ""));
      else if (!input.value.trim()) mark(input, fb, false, t("enterAns"));
      else mark(input, fb, false, t("notQuite"));
      return ok;
    }
    function checkQC1(reveal) {
      checkSym("qc1w", ["v/r"], t("exactPrefix") + "ω = v/r.", reveal, "v/r");
      checkOne("qc1aw", [5/18, 0.278], "5/18 = 0.278 rad s⁻¹ (3 s.f.).", reveal, "0.278");
      checkOne("qc1bw", [5/12, 0.417], "5/12 = 0.417 rad s⁻¹ (3 s.f.).", reveal, "0.417");
      checkOne("qc1at", [2*Math.PI*18/5, 22.6], "2π(18)/5 = 22.6 s (3 s.f.).", reveal, "22.6");
      checkOne("qc1bt", [2*Math.PI*12/5, 15.1], "2π(12)/5 = 15.1 s (3 s.f.).", reveal, "15.1");
    }

    function polar(cx, cy, r, ang) {
      return [cx + r * Math.cos(ang), cy - r * Math.sin(ang)];
    }
    function arcOnly(cx, cy, r, a0, a1) {
      const [x0, y0] = polar(cx, cy, r, a0);
      const [x1, y1] = polar(cx, cy, r, a1);
      let dth = a1 - a0;
      while (dth < 0) dth += 2 * Math.PI;
      while (dth > 2 * Math.PI) dth -= 2 * Math.PI;
      const large = dth > Math.PI ? 1 : 0;
      return `M ${x0} ${y0} A ${r} ${r} 0 ${large} 0 ${x1} ${y1}`;
    }
    function setLine(id, x1, y1, x2, y2) {
      const el = document.getElementById(id);
      if (!el) return;
      el.setAttribute("x1", x1); el.setAttribute("y1", y1);
      el.setAttribute("x2", x2); el.setAttribute("y2", y2);
    }
    function setPos(id, x, y, ax, ay) {
      const el = document.getElementById(id);
      if (!el) return;
      el.setAttribute(ax || "cx", x);
      el.setAttribute(ay || "cy", y);
    }
    function setText(id, x, y) {
      const el = document.getElementById(id);
      if (!el) return;
      el.setAttribute("x", x); el.setAttribute("y", y);
    }
    function fmt(th) {
      const keys = [
        [Math.PI/6, "π/6"], [Math.PI/4, "π/4"], [Math.PI/3, "π/3"],
        [Math.PI/2, "π/2"], [2*Math.PI/3, "2π/3"], [3*Math.PI/4, "3π/4"],
        [Math.PI, "π"], [5*Math.PI/4, "5π/4"], [3*Math.PI/2, "3π/2"],
        [7*Math.PI/4, "7π/4"], [2*Math.PI, "2π"]
      ];
      for (const [v, s] of keys) if (Math.abs(th - v) < 0.02) return s + " rad";
      return th.toFixed(2) + " rad";
    }
    function rightAngle(px, py, uxIn, uyIn, uxTan, uyTan, s) {
      const x1 = px + s * uxTan, y1 = py + s * uyTan;
      const x2 = x1 + s * uxIn, y2 = y1 + s * uyIn;
      const x3 = px + s * uxIn, y3 = py + s * uyIn;
      return `M ${x1.toFixed(2)} ${y1.toFixed(2)} L ${x2.toFixed(2)} ${y2.toFixed(2)} L ${x3.toFixed(2)} ${y3.toFixed(2)}`;
    }

    /* ---------- D1: tangent velocity ---------- */
    let d1Timer = 0, d1Last = 0, d1Play = false;
    function drawD1(th) {
      const cx = 160, cy = 125, R = 88, a0 = 0, a1 = th;
      const [x0, y0] = polar(cx, cy, R, a0);
      const [x1, y1] = polar(cx, cy, R, a1);
      setLine("d1r0", cx, cy, x0, y0);
      setLine("d1r1", cx, cy, x1, y1);
      setPos("d1start", x0, y0);
      setPos("d1obj", x1, y1);
      const sEl = document.getElementById("d1arcS");
      if (sEl) sEl.setAttribute("d", arcOnly(cx, cy, R, a0, a1));
      const ang = document.getElementById("d1ang");
      if (ang) ang.setAttribute("d", arcOnly(cx, cy, 22, a0, a1));
      // unit tangent (CCW): d/dθ of (cos θ, -sin θ) = (-sin θ, -cos θ)
      const t0x = -Math.sin(a0), t0y = -Math.cos(a0);
      const t1x = -Math.sin(a1), t1y = -Math.cos(a1);
      const L = 46;
      setLine("d1v0", x0, y0, x0 + L * t0x, y0 + L * t0y);
      setLine("d1v1", x1, y1, x1 + L * t1x, y1 + L * t1y);
      // right-angle mark at current point, between inward radius and tangent
      const inx = (cx - x1) / R, iny = (cy - y1) / R;
      const sq = document.getElementById("d1sq");
      if (sq) sq.setAttribute("d", rightAngle(x1, y1, inx, iny, t1x, t1y, 11));
      const mid = a1 / 2;
      const [tx, ty] = polar(cx, cy, 34, mid);
      setText("d1th", tx - 4, ty + 5);
      const [sx, sy] = polar(cx, cy, R + 16, mid);
      setText("d1s", Math.min(300, Math.max(10, sx - 4)), Math.max(16, sy + 4));
      const [r0x, r0y] = polar(cx, cy, R * 0.5, a0 + 0.18);
      setText("d1rl0", r0x - 4, r0y + 5);
      const [r1x, r1y] = polar(cx, cy, R * 0.55, a1 - 0.2);
      setText("d1rl1", r1x - 4, r1y + 5);
      setText("d1vl0", x0 + L * t0x + 8 * t0x - 4, y0 + L * t0y + 8 * t0y);
      setText("d1vl1", x1 + L * t1x + 8 * t1x - 4, y1 + L * t1y + 8 * t1y);
      const lbl = document.getElementById("d1lbl");
      if (lbl) lbl.textContent = fmt(th);
    }
    function tickD1(ts) {
      if (!d1Play) { d1Timer = 0; d1Last = 0; return; }
      if (!d1Last) d1Last = ts;
      const dt = Math.min(0.05, (ts - d1Last) / 1000);
      d1Last = ts;
      const sl = document.getElementById("d1slider");
      if (!sl) { d1Play = false; d1Timer = 0; return; }
      let th = +sl.value + 0.7 * dt;
      if (th >= 6.28) th = 0.25;
      sl.value = th;
      drawD1(th);
      d1Timer = requestAnimationFrame(tickD1);
    }
    function toggleD1() {
      d1Play = !d1Play;
      const btn = document.getElementById("d1play");
      if (btn) {
        btn.setAttribute("data-playing", d1Play ? "1" : "0");
        btn.textContent = d1Play ? t("stop") : t("play");
      }
      if (d1Play) {
        d1Last = 0;
        d1Timer = requestAnimationFrame(tickD1);
      }
    }

    /* ---------- D3: same ω ---------- */
    let d3Timer = 0, d3Last = 0, d3Play = false, d3Ang = 0;
    const D3_RA = 1.0; // metres (display)
    const D3_CX = 160, D3_CY = 128, D3_PX = 50;
    function drawD3() {
      const wEl = document.getElementById("d3w");
      const rEl = document.getElementById("d3ratioSl");
      if (!wEl || !rEl) return;
      const w = +wEl.value;
      const ratio = +rEl.value;
      const rB = D3_RA * ratio;
      const rApx = D3_PX, rBpx = D3_PX * ratio;
      const vA = w * D3_RA, vB = w * rB;
      document.getElementById("d3circA").setAttribute("r", rApx);
      document.getElementById("d3circB").setAttribute("r", rBpx);
      const [xA, yA] = polar(D3_CX, D3_CY, rApx, d3Ang);
      const [xB, yB] = polar(D3_CX, D3_CY, rBpx, d3Ang);
      setPos("d3objA", xA, yA);
      setPos("d3objB", xB, yB);
      setLine("d3ray", D3_CX, D3_CY, xB, yB);
      const tx = -Math.sin(d3Ang), ty = -Math.cos(d3Ang);
      const k = 22; // px per (m/s) at ω=1, r=1 → v=1
      setLine("d3vA", xA, yA, xA + k * vA * tx, yA + k * vA * ty);
      setLine("d3vB", xB, yB, xB + k * vB * tx, yB + k * vB * ty);
      setText("d3labA", xA + 10, yA - 8);
      setText("d3labB", xB + 10, yB - 8);
      setText("d3labVA", xA + k * vA * tx + 8, yA + k * vA * ty);
      setText("d3labVB", xB + k * vB * tx + 8, yB + k * vB * ty);
      const yAline = D3_CY + rBpx + 18;
      const yBline = yAline + 18;
      setLine("d3dropO", D3_CX, D3_CY, D3_CX, yBline);
      setLine("d3dropA", D3_CX + rApx, D3_CY, D3_CX + rApx, yAline);
      setLine("d3dropB", D3_CX + rBpx, D3_CY, D3_CX + rBpx, yBline);
      setLine("d3dimA", D3_CX, yAline, D3_CX + rApx, yAline);
      setLine("d3dimB", D3_CX, yBline, D3_CX + rBpx, yBline);
      setText("d3labRA", D3_CX + rApx / 2, yAline - 4);
      setText("d3labRB", D3_CX + rBpx / 2, yBline - 4);
      document.getElementById("d3wLbl").textContent = w.toFixed(2) + " rad s⁻¹";
      document.getElementById("d3rLbl").textContent = ratio.toFixed(2);
      document.getElementById("d3outA").textContent = vA.toFixed(2) + " m s⁻¹";
      document.getElementById("d3outB").textContent = vB.toFixed(2) + " m s⁻¹";
      document.getElementById("d3outR").textContent = ratio.toFixed(2);
    }
    function tickD3(ts) {
      if (!d3Play) { d3Timer = 0; d3Last = 0; return; }
      if (!d3Last) d3Last = ts;
      const dt = Math.min(0.05, (ts - d3Last) / 1000);
      d3Last = ts;
      const wEl = document.getElementById("d3w");
      if (!wEl) { d3Play = false; d3Timer = 0; return; }
      d3Ang += (+wEl.value) * dt;
      drawD3();
      d3Timer = requestAnimationFrame(tickD3);
    }
    function toggleD3() {
      d3Play = !d3Play;
      const btn = document.getElementById("d3play");
      if (btn) {
        btn.setAttribute("data-playing", d3Play ? "1" : "0");
        btn.textContent = d3Play ? t("stop") : t("play");
      }
      if (d3Play) { d3Last = 0; d3Timer = requestAnimationFrame(tickD3); }
    }

    /* ---------- D4: same v ---------- */
    let d4Timer = 0, d4Last = 0, d4Play = false, d4AngP = 0, d4AngQ = 0;
    const D4_RP = 1.0, D4_CX = 160, D4_CY = 128, D4_PX = 50;
    function drawD4() {
      const vEl = document.getElementById("d4v");
      const rEl = document.getElementById("d4ratioSl");
      if (!vEl || !rEl) return;
      const v = +vEl.value;
      const ratio = +rEl.value;
      const rQ = D4_RP * ratio;
      const rPpx = D4_PX, rQpx = D4_PX * ratio;
      const wP = v / D4_RP, wQ = v / rQ;
      document.getElementById("d4circP").setAttribute("r", rPpx);
      document.getElementById("d4circQ").setAttribute("r", rQpx);
      const [xP, yP] = polar(D4_CX, D4_CY, rPpx, d4AngP);
      const [xQ, yQ] = polar(D4_CX, D4_CY, rQpx, d4AngQ);
      setPos("d4objP", xP, yP);
      setPos("d4objQ", xQ, yQ);
      setLine("d4rayP", D4_CX, D4_CY, xP, yP);
      setLine("d4rayQ", D4_CX, D4_CY, xQ, yQ);
      const tPx = -Math.sin(d4AngP), tPy = -Math.cos(d4AngP);
      const tQx = -Math.sin(d4AngQ), tQy = -Math.cos(d4AngQ);
      const L = 40; // same length arrows (same v)
      setLine("d4vP", xP, yP, xP + L * tPx, yP + L * tPy);
      setLine("d4vQ", xQ, yQ, xQ + L * tQx, yQ + L * tQy);
      setText("d4labP", xP + 10, yP - 8);
      setText("d4labQ", xQ + 10, yQ - 8);
      setText("d4labVP", xP + L * tPx + 8, yP + L * tPy);
      setText("d4labVQ", xQ + L * tQx + 8, yQ + L * tQy);
      const yPline = D4_CY + rQpx + 18;
      const yQline = yPline + 18;
      setLine("d4dropO", D4_CX, D4_CY, D4_CX, yQline);
      setLine("d4dropP", D4_CX + rPpx, D4_CY, D4_CX + rPpx, yPline);
      setLine("d4dropQ", D4_CX + rQpx, D4_CY, D4_CX + rQpx, yQline);
      setLine("d4dimP", D4_CX, yPline, D4_CX + rPpx, yPline);
      setLine("d4dimQ", D4_CX, yQline, D4_CX + rQpx, yQline);
      setText("d4labRP", D4_CX + rPpx / 2, yPline - 4);
      setText("d4labRQ", D4_CX + rQpx / 2, yQline - 4);
      document.getElementById("d4vLbl").textContent = v.toFixed(2) + " m s⁻¹";
      document.getElementById("d4rLbl").textContent = ratio.toFixed(2);
      document.getElementById("d4outP").textContent = wP.toFixed(2) + " rad s⁻¹";
      document.getElementById("d4outQ").textContent = wQ.toFixed(2) + " rad s⁻¹";
      document.getElementById("d4outR").textContent = (wQ / wP).toFixed(2);
    }
    function tickD4(ts) {
      if (!d4Play) { d4Timer = 0; d4Last = 0; return; }
      if (!d4Last) d4Last = ts;
      const dt = Math.min(0.05, (ts - d4Last) / 1000);
      d4Last = ts;
      const vEl = document.getElementById("d4v");
      const rEl = document.getElementById("d4ratioSl");
      if (!vEl || !rEl) { d4Play = false; d4Timer = 0; return; }
      const v = +vEl.value, ratio = +rEl.value;
      d4AngP += (v / D4_RP) * dt;
      d4AngQ += (v / (D4_RP * ratio)) * dt;
      drawD4();
      d4Timer = requestAnimationFrame(tickD4);
    }
    function toggleD4() {
      d4Play = !d4Play;
      const btn = document.getElementById("d4play");
      if (btn) {
        btn.setAttribute("data-playing", d4Play ? "1" : "0");
        btn.textContent = d4Play ? t("stop") : t("play");
      }
      if (d4Play) { d4Last = 0; d4Timer = requestAnimationFrame(tickD4); }
    }

    function stopAnims() {
      d1Play = false; d3Play = false; d4Play = false;
      if (d1Timer) { cancelAnimationFrame(d1Timer); d1Timer = 0; }
      if (d3Timer) { cancelAnimationFrame(d3Timer); d3Timer = 0; }
      if (d4Timer) { cancelAnimationFrame(d4Timer); d4Timer = 0; }
      d1Last = d3Last = d4Last = 0;
      ["d1play", "d3play", "d4play"].forEach((id) => {
        const b = document.getElementById(id);
        if (b) { b.setAttribute("data-playing", "0"); b.textContent = t("play"); }
      });
    }

    function initStep(n) {
      stopAnims();
      const step = steps[n];

      const d1s = document.getElementById("d1slider");
      if (d1s && step.contains(d1s)) {
        if (!d1s.dataset.ready) {
          d1s.addEventListener("input", () => drawD1(+d1s.value));
          document.getElementById("d1play").addEventListener("click", toggleD1);
          d1s.dataset.ready = "1";
        }
        drawD1(+d1s.value);
      }

      const d3w = document.getElementById("d3w");
      if (d3w && step.contains(d3w)) {
        if (!d3w.dataset.ready) {
          d3w.addEventListener("input", drawD3);
          document.getElementById("d3ratioSl").addEventListener("input", drawD3);
          document.getElementById("d3play").addEventListener("click", toggleD3);
          d3w.dataset.ready = "1";
        }
        drawD3();
        // auto-play this explorer so the shared ω is obvious
        if (!d3Play) toggleD3();
      }

      const d4v = document.getElementById("d4v");
      if (d4v && step.contains(d4v)) {
        if (!d4v.dataset.ready) {
          d4v.addEventListener("input", drawD4);
          document.getElementById("d4ratioSl").addEventListener("input", drawD4);
          document.getElementById("d4play").addEventListener("click", toggleD4);
          d4v.dataset.ready = "1";
        }
        drawD4();
        if (!d4Play) toggleD4();
      }

      const c1 = document.getElementById("checkQC1");
      if (c1 && !c1.dataset.ready) {
        c1.addEventListener("click", () => checkQC1(false));
        document.getElementById("revealQC1").addEventListener("click", () => checkQC1(true));
        c1.dataset.ready = "1";
      }
    }

    document.getElementById("langEn").addEventListener("click", () => setLang("en"));
    document.getElementById("langZh").addEventListener("click", () => setLang("zh-HK"));

    const params = new URLSearchParams(location.search);
    const ql = params.get("lang");
    if (ql === "zh-HK" || ql === "en") {
      lang = ql;
      try { localStorage.setItem("cm11.lang", lang); } catch (e) {}
    }
    const q = params.get("step");
    const start = q !== null && !isNaN(+q) ? Math.max(0, Math.min(steps.length - 1, +q)) : 0;
    go(start);
  })();
  </script>
</body>
</html>
